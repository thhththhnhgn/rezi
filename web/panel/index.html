<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c19">
<meta name="robots" content="noindex,nofollow">
<title>Ultra Gaming — Control Center</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css?v=3.7.0">
</head>
<body>
<canvas id="particles"></canvas>

<!-- ══ LOGIN ══ -->
<div class="login" id="login">
  <form class="box" id="loginForm" autocomplete="on">
    <div class="mark">⚡</div>
    <h1>ULTRA GAMING</h1>
    <p class="tag">CONTROL CENTER</p>
    <p class="tag" id="loginVer" style="margin-top:-14px;margin-bottom:18px;font-size:11px;opacity:.9"></p>
    <div class="err hide" id="loginErr"></div>
    <div class="field">
      <label data-i="username">Username</label>
      <input id="lu" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label data-i="password">Password</label>
      <input id="lp" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn block" id="loginBtn" type="submit" data-i="login">Sign in</button>
    <div style="text-align:center;margin-top:14px">
      <button type="button" class="tab" onclick="UG.setLang(UG.lang()==='fa'?'en':'fa')">🌐 EN / فا</button>
    </div>
  </form>
</div>

<!-- ══ APP ══ -->
<div class="shell hide" id="app">
  <aside class="side" id="side">
    <div class="brand">
      <span class="mark">⚡</span>
      <div><b>ULTRA</b><small id="verTag">GAMING v3</small></div>
    </div>
    <a class="navlink on" data-page="dash"><span class="ic">◇</span><span data-i="dashboard">Dashboard</span></a>
    <a class="navlink" data-page="users"><span class="ic">◉</span><span data-i="users">Players</span></a>
    <a class="navlink" data-page="analytics"><span class="ic">≋</span><span data-i="analytics">Analytics</span></a>
    <a class="navlink" data-page="race"><span class="ic">◎</span><span data-i="race">Latency Race</span></a>
    <a class="navlink" data-page="games"><span class="ic">⬢</span><span data-i="gameping">Game Ping</span></a>
    <a class="navlink" data-page="locations"><span class="ic">⬡</span><span data-i="locations">Locations</span></a>
    <a class="navlink" data-page="trials"><span class="ic">✦</span><span data-i="trials">Trial Links</span></a>
    <a class="navlink" data-page="console"><span class="ic">›</span><span data-i="console">Console</span></a>
    <a class="navlink" data-page="settings"><span class="ic">⬢</span><span data-i="settings">Settings</span></a>
    <div class="spacer"></div>
    <div class="foot">
      <button class="tab" onclick="UG.setLang(UG.lang()==='fa'?'en':'fa')">🌐 EN/فا</button>
      <button class="tab" id="logoutBtn" data-i="logout">Logout</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="burger" id="burger" aria-label="Menu">☰</button>
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="sub" id="pageSub">Real-time monitoring</div>
      </div>
      <div class="grow"></div>
      <span class="pill" id="xrayPill"><span class="dot"></span><span data-i="xray">Xray</span></span>
      <span class="pill" id="livePill"><span class="dot"></span>LIVE</span>
    </div>

    <div id="pages"></div>
  </main>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>

<script src="/assets/qr.js?v=3.7.0"></script>
<script src="/assets/core.js?v=3.7.0"></script>
<script src="/assets/panel.js?v=3.7.0"></script>
</body>
</html>
