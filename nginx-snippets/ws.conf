proxy_http_version 1.1;
proxy_set_header   Upgrade           $http_upgrade;
proxy_set_header   Connection        $connection_upgrade;
proxy_set_header   Host              $http_host;
proxy_set_header   X-Real-IP         $real_client_ip;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;

# ── latency ───────────────────────────────────────────────────────────
# Nagle off on the connection to Xray. Without this nginx coalesces the
# small frames a game produces and adds up to 40ms per packet.
tcp_nodelay on;
# Never accumulate a request body before forwarding it. For a tunnel the
# body is the tunnel, so buffering it means buffering the whole session.
proxy_request_buffering off;
proxy_buffering    off;
proxy_cache        off;

# ── liveness ──────────────────────────────────────────────────────────
# Cloudflare reaps idle HTTP at ~100s and Xray heartbeats at 20s, so nginx
# must outlast both or it becomes the component that drops the tunnel.
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
proxy_connect_timeout 5s;
proxy_socket_keepalive on;

# ── gaming tuning ─────────────────────────────────────────────────────
# TCP_NODELAY is already set above; these further reduce latency:
#   - proxy_http_version 1.1: persistent connections avoid TCP churn
#   - no proxy_buffering: packets flow immediately to Xray
#   - long timeouts: game sessions can idle for hours without drop
